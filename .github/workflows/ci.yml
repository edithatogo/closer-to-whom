name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-matrix:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --locked --extra dev --extra geo
      - name: Unit, property, and contract tests
        run: uv run pytest -q --no-cov tests/unit tests/property tests/contract
  full:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
          cache: pip
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Static quality
        run: |
          uv run ruff format --check src tests scripts
          uv run ruff check src tests scripts
          uv run mypy src
          uv run pyright src
      - name: Test with coverage
        run: uv run pytest -q --cov=closer_to_whom --cov-report=xml --cov-report=term-missing --cov-fail-under=89
      - name: Contracts and boundaries
        run: |
          uv run python scripts/check_contracts.py
          uv run python scripts/check_claim_boundaries.py
          uv run python scripts/check_privacy_and_licences.py
          uv run python scripts/secret_scan.py
      - name: Reproducibility
        run: uv run python scripts/check_reproducibility.py
      - name: JAX differential
        run: uv run python scripts/jax_differential.py
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
