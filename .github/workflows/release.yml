name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-release:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run python scripts/release_gate.py
      - run: uv run python scripts/publication_readiness.py
      - run: uv run python scripts/create_release_manifest.py
      - name: Build source archive and bundle
        run: |
          git archive --format=zip --output=release/closer-to-whom-${GITHUB_REF_NAME}.zip HEAD
          git bundle create release/closer-to-whom-${GITHUB_REF_NAME}.bundle --all
          checksum_file="$(mktemp)"
          find release -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$checksum_file"
          mv "$checksum_file" release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate
          path: |
            release/
            dist/
          if-no-files-found: error
      - uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*
            dist/*
          generate_release_notes: true
