name: Public Space assurance

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-space-assurance
  cancel-in-progress: true

jobs:
  probe:
    environment: hugging-face
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Require public Space identifier
        shell: bash
        run: |
          test -n "$HF_SPACE_ID"
          case "$HF_SPACE_ID" in */*) ;; *) echo "HF_SPACE_ID must be namespace/name" >&2; exit 1 ;; esac
      - name: Probe public Space
        run: python scripts/check_space_public.py "https://huggingface.co/spaces/${HF_SPACE_ID}/raw/main/index.html"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-space-assurance-${{ github.run_id }}
          path: release/space-monitor-receipt.json
          if-no-files-found: error
          retention-days: 30
