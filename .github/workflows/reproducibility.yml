name: Reproducibility
on:
  pull_request:
    paths: ["src/**", "assumptions/**", "scenarios/**", "data/synthetic/**", "uv.lock"]
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clean-double-build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run python scripts/check_reproducibility.py
      - run: uv run python -m build
      - run: uv run python scripts/smoke_install.py
