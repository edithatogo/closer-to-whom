name: Clean-room reproducibility

permissions:
  contents: read

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: clean-room-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run python scripts/clean_room_verify.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: clean-room-receipt
          path: release/clean-room-receipt.json
          if-no-files-found: warn
