name: Upstream integration watch
on:
  schedule:
    - cron: "11 5 * * 2"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-watch
  cancel-in-progress: true
jobs:
  compatibility:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run python scripts/check_upstream_compatibility.py
      - run: uv run python scripts/upstream_compatibility.py
      - run: >-
          uv run python scripts/refresh_upstream_metadata.py
          --output release/upstream-metadata-live.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upstream-compatibility-${{ github.run_id }}
          path: |
            reports/upstream-compatibility.json
            release/upstream-metadata-live.json
          if-no-files-found: error
          retention-days: 30
