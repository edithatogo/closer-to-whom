name: Upstream integration watch
on:
  schedule:
    - cron: "11 5 * * 2"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-watch
  cancel-in-progress: true
jobs:
  compatibility:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run python scripts/check_upstream_compatibility.py
      - run: uv run python scripts/upstream_compatibility.py
      - run: >-
          uv run python scripts/refresh_upstream_metadata.py
          --output release/upstream-metadata-live.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upstream-compatibility-${{ github.run_id }}
          path: |
            reports/upstream-compatibility.json
            release/upstream-metadata-live.json
          if-no-files-found: error
          retention-days: 30
