name: Manuscript scaffolds

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "manuscript/**"
      - "docs/publication/**"
      - "assumptions/**"
      - ".github/workflows/manuscript.yml"
  push:
    branches: [main]
    paths:
      - "manuscript/**"
      - "docs/publication/**"
      - "assumptions/**"
  workflow_dispatch:

concurrency:
  group: manuscript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
      - uses: quarto-dev/quarto-actions/render@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          path: manuscript
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: manuscript-scaffolds
          path: release/manuscript
          if-no-files-found: error
