name: Mojo canary
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 3"
permissions:
  contents: read
concurrency:
  group: mojo-canary
  cancel-in-progress: true
jobs:
  canary:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Install Mojo toolchain locally
        run: |
          echo "Install the pinned Modular/Mojo toolchain here once the local release channel is selected."
          echo "This scheduled canary remains non-release-critical until ADR promotion gates pass."
      - run: uv run closer-to-whom mojo-canary
