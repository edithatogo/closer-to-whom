name: Dashboard container
on:
  pull_request:
    paths: ["src/closer_to_whom/dashboard/**", "containers/**", "app.py", "artifacts/demo/**", "Dockerfile", ".github/workflows/dashboard.yml"]
  push:
    branches: [main]
    paths: ["src/closer_to_whom/dashboard/**", "containers/**", "app.py", "artifacts/demo/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-smoke:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run closer-to-whom demo --output artifacts/demo
      - run: uv run python scripts/dashboard_smoke.py
      - name: Build image
        run: docker build -f containers/huggingface.Dockerfile -t closer-to-whom-space:${{ github.sha }} .
      - name: Scan image contents for prohibited paths
        run: |
          docker run --rm --entrypoint sh closer-to-whom-space:${{ github.sha }} -c \
            'test ! -e /app/data/raw && test ! -e /app/data/licensed && test ! -e /app/data/private'
      - name: Generate image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: closer-to-whom-space:${{ github.sha }}
          format: cyclonedx-json
          output-file: release/container-sbom.cdx.json
          artifact-name: container-sbom-${{ github.sha }}.cdx.json
          upload-artifact: true
          upload-artifact-retention: 30
      - name: Attest image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-path: release/container-sbom.cdx.json
          sbom-path: release/container-sbom.cdx.json
