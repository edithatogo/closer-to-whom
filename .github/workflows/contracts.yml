name: Contracts and generated files
on:
  pull_request:
    paths:
      - "assumptions/**"
      - "scenarios/**"
      - "schemas/**"
      - "upstream/**"
      - "data/public/**"
      - "conductor/**"
      - "docs/**"
      - "mkdocs.yml"
      - "docs/publication/**"
      - "docs/operations/dashboard.md"
      - "docs/reference/api.md"
      - "scripts/check_*"
      - "scripts/publication_readiness.py"
      - "scripts/release_gate.py"
      - "scripts/fetch_stats_nz_population_chunks.py"
      - "scripts/materialize_treatment_delivery_scenarios.py"
      - "scripts/build_national_static_space.py"
      - "reports/national-analysis/**"
      - "release/**"
      - "Makefile"
      - "scripts/reconcile_release_receipts.py"
      - "scripts/generate_sbom.py"
      - "tests/unit/test_sbom.py"
      - "tests/unit/test_static_space.py"
      - "tests/unit/test_national_static_space.py"
      - ".github/workflows/**"
      # Dependency manifests must trigger lockfile and schema compatibility checks.
      - "Dockerfile"
      - "containers/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run python scripts/check_contracts.py
      - run: uv run python scripts/check_generated_files.py
      - run: uv run python scripts/check_lockfile_portability.py
      - run: uv run python scripts/check_claim_boundaries.py
      - run: uv run python scripts/check_privacy_and_licences.py
