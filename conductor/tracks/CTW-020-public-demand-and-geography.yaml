schema_version: "1.0.0"
track_id: CTW-020-public-demand-and-geography
status: active
github_issue: https://github.com/edithatogo/closer-to-whom/issues/3
objective: Build aggregate expected-demand cells and within-area spatial draws from public data.
acceptance_criteria:
  - No individual-like records are created.
  - Geography, population, ethnicity, deprivation, rurality, and vehicle-access versions are frozen.
  - Routing-point weights sum to one and spatial uncertainty is reproducible.
  - Aggregate model calibrates to declared public totals.
  - Every non-frozen input records an explicit pending reason; pending state is never inferred from missing metadata.
progress:
  completed:
    - Captured and deterministically materialized the 2,313-row Stats NZ SA2 population denominator.
    - Calibrated national expected annual courses to declared public aggregate totals.
    - Implemented and tested paginated official SA2 polygon-centroid retrieval with deterministic weights.
  remaining:
    - Retry the official ArcGIS centroid retrieval and freeze its receipt after the 2026-07-24 network timeout.
    - Materialize deprivation, rurality, ethnicity, and vehicle-access stratifiers.
    - Add population-weighted multi-point sensitivity origins before publication analysis.
