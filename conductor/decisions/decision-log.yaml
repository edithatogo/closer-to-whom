schema_version: "1.0.0"
decisions:
  - id: DEC-001
    date: 2026-07-11
    status: accepted
    decision: Use all of New Zealand as the principal geography.
    rationale: National analysis is policy relevant and supports infrastructure planning; Northern remains historical motivation and a possible subgroup.
  - id: DEC-002
    date: 2026-07-11
    status: accepted
    decision: Restrict the open phase to public aggregate data.
    rationale: Enables independent reproducibility and an out-of-scope policy-evaluation framing while acknowledging simulated limitations.
  - id: DEC-003
    date: 2026-07-11
    status: accepted
    decision: Use Polars and Arrow as the canonical data plane.
    rationale: Supports performance, schema contracts, and multi-language backends.
  - id: DEC-004
    date: 2026-07-11
    status: accepted
    decision: Support JAX now and develop Mojo behind promotion gates.
    rationale: Preserve bleeding-edge acceleration without making an immature toolchain a single point of failure.
  - id: DEC-005
    date: 2026-07-11
    status: accepted
    decision: Combine optimisation with MCDA rather than substituting one for the other.
    rationale: Optimisation identifies efficient candidates; MCDA exposes normative trade-offs.
  - id: DEC-006
    date: 2026-07-11
    status: accepted
    decision: Treat lack of capacity data as a model output question.
    rationale: Estimate implied capacity and test envelopes rather than inventing current operations.
  - id: DEC-007
    date: 2026-07-11
    status: accepted
    decision: Make microdata escalation a VOI decision.
    rationale: Further research is justified by expected decision value, equity relevance, and net benefit rather than granularity alone.
  - id: DEC-008
    date: 2026-07-11
    status: accepted
    decision: Serve only precomputed aggregate cubes in the public Space.
    rationale: Improves security, reproducibility, licensing compliance, and latency.
  - id: DEC-009
    date: 2026-07-15
    status: accepted
    decision: Use SA2 under Stats NZ SSGA23 as the planned principal geography backbone.
    rationale: SSGA23 is the current official geography standard and SA2 provides a practical public aggregate unit; the input and licence freeze remains an explicit gate.
  - id: DEC-010
    date: 2026-07-15
    status: accepted
    decision: Use GCH23 only as a separate rurality stratifier, not as a substitute for route-based access.
    rationale: Rurality and network travel answer different questions. GCH23 is recorded as restricted CC BY-ND material, so transformed redistribution requires permission before publication.
  - id: DEC-011
    date: 2026-07-15
    status: accepted
    decision: Keep the early-breast-cancer pathway synthetic and non-evidentiary until clinical and funding review is complete.
    rationale: Current Pharmac evidence supports funded Phesgo use for HER2-positive metastatic breast cancer from 1 December 2025, but does not establish early-disease eligibility, clinical schedule, or facility capability for this model.
  - id: DEC-012
    date: 2026-07-21
    status: accepted
    decision: >-
      Operate the repository as a sole-developer code harness with zero required GitHub approvals,
      while requiring dated qualified-clinician attestations for the CTW-010 clinical, completeness,
      and licensing scopes and retaining separate equity and ethics governance gates.
    rationale: >-
      A second software reviewer is not part of the operating model. The qualified clinician may
      attest to the defined CTW-010 evidence scopes; attestations remain fail-closed evidence gates
      and are not implied by a code review or local test run.
  - id: DEC-013
    date: 2026-07-21
    status: accepted
    decision: Represent each Māori/equity and ethics governance output with an explicit pending or completed contract state.
    rationale: >-
      Empty review receipts must not be mistaken for a completed governance decision; explicit
      states preserve the external human-review and HDEC boundaries in machine-readable form.
  - id: DEC-014
    date: 2026-07-21
    status: accepted
    decision: Record unavailable GitHub secret-scanning account controls as an explicit security blocker.
    rationale: >-
      Repository-level secret scanning and push protection are enabled, but GitHub reports
      non-provider pattern scanning and validity checks as unavailable or disabled. The owner
      and exact enablement request are documented without overstating the current security posture.
  - id: DEC-015
    date: 2026-07-22
    status: accepted
    decision: >-
      For the current public aggregate and synthetic static harness, Māori/equity review and
      ethics/HDEC determination are out of scope. The sole developer qualified clinician approves
      the licensed public-input freeze, qualified-clinical-attestation model, and policy-publication
      scope, subject to source-level receipts and the remaining evidence gates.
    rationale: >-
      The user explicitly narrowed the current harness to public aggregate policy evaluation and
      approved the three operating gates. This does not claim Māori endorsement, ethical approval,
      HDEC exemption, or authorise a future microdata phase.
  - id: DEC-016
    date: 2026-07-22
    status: accepted
    decision: >-
      Treat the user's explicit authorization as approval for local use of the retrieved public
      source files in the sole-developer harness. Freeze the input manifest while retaining each
      source's factual licence state, provenance receipt, and non-redistribution posture.
    rationale: >-
      Repeatedly reopening the already-granted project authorization adds no evidence. The harness
      still records source uncertainty and prevents source payload redistribution.
  - id: DEC-017
    date: 2026-07-24
    status: accepted
    decision: >-
      Use the captured SA2 population artifact as the authorized local denominator backbone;
      calibrate breast-cancer demand only to public aggregate incidence, retain HER2 and uptake
      as uncertainty scenarios, use versioned road/public-transport routing scenarios, and keep
      restricted inputs artifact-only until redistribution permissions are explicit.
    rationale: >-
      The user approved these operating decisions for autonomous continuation. They define model
      methods without converting synthetic parameters, unknown capability, or licence uncertainty
      into observed clinical or operational claims.
  - id: DEC-018
    date: 2026-07-24
    status: accepted
    decision: >-
      Use official SSGA23 polygon centroids as the deterministic aggregate routing baseline and
      a loopback-only OSRM table service built from a pinned New Zealand OpenStreetMap extract for
      national road routing. Retain population-weighted multi-point origins and regional public
      transport feeds as separate sensitivity scenarios.
    rationale: >-
      This closes the method-selection gap with reproducible public sources while keeping centroid
      bias, network vintage, mode availability, and regional feed coverage explicit. Public OSRM
      demo services are excluded from release dependencies.
  - id: DEC-019
    date: 2026-07-27
    status: accepted
    decision: >-
      Use official 2023 Census SA2 total-response broad ethnicity groups and the share of occupied
      private dwellings reporting no motor vehicle as ecological stratifiers. Preserve ethnicity
      groups as overlapping measures and vehicle access as a household-area proxy.
    rationale: >-
      The public Stats NZ ArcGIS layers match all 2,313 population-denominator SA2 codes and declare
      CC BY 4.0. These aggregate measures support distributional scenarios without creating
      individuals, assigning exclusive ethnicity, or asserting observed personal transport access.
  - id: DEC-020
    date: 2026-07-27
    status: accepted
    decision: >-
      Use every positive-population 2023 Census SA1 true polygon centroid as a population-weighted
      within-SA2 sensitivity origin, retaining the official SA2 true centroid as the primary
      baseline and as a declared fallback where no unambiguous positive SA1 origin is available.
    rationale: >-
      This quantifies centroid bias with public aggregate geography while avoiding pseudo-people.
      All 2,313 denominator SA2s remain covered and weights reconcile to one; 45 zero-population and
      four positive-population SA2s retain explicit fallback because the source offers no
      unambiguous positive SA1 assignment.
  - id: DEC-021
    date: 2026-07-27
    status: accepted
    decision: >-
      Materialize one baseline aggregate demand cell per SA2, allocating the national expected-course
      scenario in proportion to public 2023 Census female population. Keep overlapping ethnicity and
      vehicle-access profiles separate, permit explicit unknown deprivation, and retain multi-point
      origins as a routing sensitivity rather than duplicating demand.
    rationale: >-
      This produces a reconciled national demand table without pseudo-patients or double counting.
      Source-unavailable female counts use a declared population-scaled national-share fallback;
      the allocation is a structural planning assumption, not observed small-area incidence.
  - id: DEC-022
    date: 2026-07-27
    status: accepted
    decision: >-
      Freeze official IRD kilometre rates as private-vehicle resource-cost scenarios and official
      National Travel Assistance mileage and accommodation rates as reimbursement scenarios.
      Report distance, duration, reimbursement, and resource costs separately; keep route-specific
      fares, parking, walking/waiting/transfer valuation, and provider travel costs unknown until
      suitable evidence is materialized.
    rationale: >-
      Tax kilometre rates and reimbursement schedules are transparent public policy parameters,
      but neither measures observed patient expenditure or behaviour. Explicit unknown categories
      prevent unsupported zeroes or synthetic averages from entering national policy results.
  - id: DEC-023
    date: 2026-07-27
    status: accepted
    decision: >-
      Build the national road matrix from a minimal aggregate SA2 origin contract containing only
      stable demand-cell identifiers and official coordinates. Keep expected demand, deprivation,
      ethnicity, and rurality as separate analysis inputs.
    rationale: >-
      Route geometry does not depend on equity or demand attributes. This separation prevents an
      upstream host restriction on the frozen NZDep workbook from blocking independent OSRM
      evidence, while preserving the workbook's non-redistribution boundary and avoiding any
      substitution or fabricated stratifier values.
  - id: DEC-024
    date: 2026-07-27
    status: accepted
    decision: >-
      Define CTW-050 as a bounded aggregate candidate-network analysis over five nested site-count
      configurations using verified OSRM routes, source-backed demand weights, explicit vehicle-rate
      scenarios, non-compensatory clinical gates, normative MCDA viewpoints, and unitless VOI for
      weight uncertainty.
    rationale: >-
      Public evidence identifies plausible locations but not drug-specific capability, capacity, or
      operational feasibility. This design produces reproducible decision-analysis evidence without
      converting those unknowns into facts, monetising unsupported components, or using synthetic
      probability distributions as national estimates.