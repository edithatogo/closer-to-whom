[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "closer-to-whom"
version = "0.2.0"
description = "Public-data geospatial policy simulation of anti-HER2 cancer treatment access in Aotearoa New Zealand"
readme = "README.md"
requires-python = "==3.14.7"
license = { text = "MIT" }
authors = [{ name = "Dylan" }]
keywords = ["health-services", "geospatial", "equity", "cancer", "Aotearoa-New-Zealand", "simulation", "value-of-information"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "numpy==2.5.1",
  "polars==1.42.1",
  "pyarrow==25.0.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "typer==0.26.8",
  "rich==15.0.0",
  "orjson==3.11.9",
  "PyYAML==6.0.3",
  "platformdirs==4.10.0",
  "structlog==26.1.0",
  "scipy==1.18.0",
]

[project.optional-dependencies]
accel = [
  "jax==0.10.2",
  "jaxlib==0.10.2",
]
geo = [
  "geopandas==1.1.4",
  "shapely==2.1.2",
  "pyogrio==0.13.0",
  "h3==4.5.0",
  "duckdb==1.5.4",
]
optimisation = [
  "highspy==1.15.1",
  "ortools==9.15.6755",
]
dashboard = [
  "dash==4.4.0",
  "plotly==6.9.0",
  "gunicorn==26.0.0",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]==1.0.6",
  "mkdocs-gen-files==0.6.1",
  "mkdocs-literate-nav==0.6.3",
]
dev = [
  "build==1.5.1",
  "codespell==2.4.2",
  "coverage[toml]==7.15.1",
  "deptry==0.25.1",
  "hypothesis==6.156.6",
  "interrogate==1.7.0",
  "mypy==2.3.0",
  "nox==2026.7.11",
  "pip-audit==2.10.1",
  "pre-commit==4.6.0",
  "bandit==1.9.4",
  "defusedxml==0.7.1",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-timeout==2.4.0",
  "pytest-xdist==3.8.0",
  "ruff==0.15.21",
  "tomli-w==1.2.0",
  "vulture==2.16",
  "zizmor==1.26.1",
]
all = [
  "closer-to-whom[accel,geo,optimisation,dashboard,docs,dev]",
]

[project.urls]
Repository = "https://github.com/edithatogo/closer-to-whom"
Documentation = "https://edithatogo.github.io/closer-to-whom/"
Issues = "https://github.com/edithatogo/closer-to-whom/issues"

[project.scripts]
closer-to-whom = "closer_to_whom.cli:app"
ctw = "closer_to_whom.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/closer_to_whom"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = ["upstream", "artifacts", "data/derived"]

[tool.ruff.lint]
select = [
  "B", "BLE", "C4", "DTZ", "E4", "E7", "E9", "ERA", "EXE", "F", "FA",
  "FLY", "FURB", "G", "I", "ICN", "INT", "LOG", "N", "NPY", "PERF",
  "PGH", "PIE", "PL", "PTH", "PYI", "Q", "RET", "RSE", "RUF", "SIM",
  "SLOT", "T10", "TID", "TRY", "UP", "W", "YTT",
]

ignore = [
  "COM812", "E501", "PERF401", "PLC0415", "PLR0912", "PLR0913",
  "PLR0911", "PLR0915", "PLR2004", "RUF001", "RUF002", "RUF005", "S310", "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "PT011", "PT018", "SLF001"]
"scripts/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["closer_to_whom"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "--strict-config", "--strict-markers", "--showlocals", "--tb=short",
  "--durations=20", "--timeout=60", "-p", "no:randomly",
  "--cov=closer_to_whom", "--cov-branch", "--cov-report=term-missing",
  "--cov-report=xml", "--cov-fail-under=89",
]
testpaths = ["tests"]
markers = [
  "slow: slower tests excluded from the default developer loop",
  "integration: cross-component integration tests",
  "network: tests requiring the public internet",
  "jax: tests requiring JAX",
  "dashboard: dashboard smoke tests",
  "mojo: tests requiring a Mojo toolchain",
]
filterwarnings = ["error", "ignore:.*distutils.*:DeprecationWarning"]

[tool.coverage.run]
branch = true
parallel = true
source = ["closer_to_whom"]
omit = ["src/closer_to_whom/dashboard/app.py"]

[tool.coverage.report]
fail_under = 89
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.14"
strict = true
follow_imports = "skip"
disallow_any_unimported = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false
warn_unused_ignores = false
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
exclude = ["upstream", "artifacts"]

[[tool.mypy.overrides]]
module = ["jax.*", "scipy.*", "dash.*", "plotly.*", "highspy.*", "ortools.*", "pyarrow.*", "yaml"]
ignore_missing_imports = true

[tool.pyright]
include = ["src"]
exclude = ["upstream", "artifacts", "data"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.codespell]
ignore-words-list = "hdec,te,aho,whanau,maori,pharmac,phesgo,trastuzumab,nzmj,healthpoint,sourceright,authentext,voiage,kairos,ane"
skip = "*.lock,*.svg,*.jsonl,upstream/*,artifacts/*,site/*,release/receipts/logs/*,dist/*,build/*,.venv/*"

[tool.deptry]
known_first_party = ["closer_to_whom"]
extend_exclude = ["scripts", "tests"]

[tool.interrogate]
fail-under = 90
exclude = ["tests", "scripts"]
ignore-init-method = true
ignore-module = false
verbose = 1

[tool.vulture]
min_confidence = 85
paths = ["src", "scripts"]
exclude = ["src/closer_to_whom/dashboard/app.py"]

[tool.hypothesis]
deadline = 1000
